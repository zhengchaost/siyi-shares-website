<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目案例 · 超赞文旅 | 肆意股份</title>
  <meta name="description" content="超赞文旅项目案例库，涵盖文旅商业、城市综合体、主题商业与产业园区等方向的代表项目。" />
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            seg: {
              green:    '#2D5A4E',
              'green-dark': '#1E3D35',
              'green-deeper': '#162D27',
              'green-light': '#3D7A6A',
              'green-pale': '#EBF2F0',
              gold:     '#C9A84C',
              'gold-light': '#E2C47A',
              charcoal: '#1A1A1A',
              muted:    '#6B7280',
              border:   '#E5EAE8',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            serif:   ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Serif SC', serif; color: #1A1A1A; background: #fff; }
    .fade-up { opacity:0; transform:translateY(36px); transition: opacity .85s cubic-bezier(.22,1,.36,1), transform .85s cubic-bezier(.22,1,.36,1); }
    .fade-up.visible { opacity:1; transform:translateY(0); }
    .fade-in { opacity:0; transition: opacity .9s ease; }
    .fade-in.visible { opacity:1; }
    #navbar { transition: background .4s ease, box-shadow .4s ease; }
    .nav-scrolled { background: rgba(22,45,39,0.97)!important; backdrop-filter: blur(16px); box-shadow: 0 1px 0 rgba(255,255,255,0.06); }
    .nav-link { position:relative; }
    .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:1px; background:#C9A84C; transition: width .3s ease; }
    .nav-link:hover::after { width:100%; }
    .section-eyebrow { display:inline-flex; align-items:center; gap:10px; font-family:'Inter',sans-serif; font-size:10px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:#2D5A4E; }
    .section-eyebrow::before,.section-eyebrow::after { content:''; display:block; width:24px; height:1px; background:#2D5A4E; }
    .case-card { transition: transform .3s ease, box-shadow .3s ease; }
    .case-card:hover { transform:translateY(-5px); box-shadow:0 20px 40px rgba(0,0,0,0.1); }
    .case-tag { font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.15em; text-transform:uppercase; }
    .tab-btn { font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.08em; transition:all .25s ease; }
    .tab-btn.active { background:#2D5A4E; color:#fff; border-color:#2D5A4E; }
    .tab-btn:not(.active):hover { border-color:#2D5A4E; color:#2D5A4E; }
    .mobile-menu { transform:translateX(100%); transition:transform .35s cubic-bezier(.22,1,.36,1); }
    .mobile-menu.open { transform:translateX(0); }
  </style>
</head>
<body class="bg-white">

  <!-- NAVIGATION -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50" style="background:rgba(14,36,32,0.55);backdrop-filter:blur(8px);">
    <div class="max-w-7xl mx-auto px-6 lg:px-10">
      <div class="flex items-center justify-between h-16 lg:h-20">
        <a href="chaozan-travel.html" class="flex items-center gap-3 group">
          <img src="/images/siyi-logo-white.webp" alt="SEG" class="h-7 w-auto opacity-90 group-hover:opacity-100 transition-opacity">
          <div class="hidden sm:block">
            <p class="text-white font-serif text-sm font-semibold leading-none tracking-wide">超赞文旅</p>
            <p class="text-white/40 text-[9px] tracking-[0.2em] mt-0.5 font-sans">CHAOZAN TRAVEL</p>
          </div>
        </a>
        <div class="hidden lg:flex items-center gap-8">
          <a href="chaozan-travel.html#about" class="nav-link text-white/75 hover:text-white text-sm font-sans transition-colors">关于我们</a>
          <a href="chaozan-travel.html#services" class="nav-link text-white/75 hover:text-white text-sm font-sans transition-colors">核心能力</a>
          <a href="chaozan-travel.html#products" class="nav-link text-white/75 hover:text-white text-sm font-sans transition-colors">产品线</a>
          <a href="chaozan-travel-cases.html" class="nav-link text-white text-sm font-sans transition-colors">案例展示</a>
          <a href="chaozan-travel.html#contact" class="nav-link text-white/75 hover:text-white text-sm font-sans transition-colors">联系我们</a>
        </div>
        <a href="chaozan-travel.html#contact" class="hidden lg:inline-flex items-center gap-2 px-5 py-2.5 bg-seg-gold text-seg-charcoal text-xs font-sans font-semibold tracking-wider rounded-sm hover:bg-seg-gold-light transition-colors">合作咨询</a>
        <button class="lg:hidden text-white p-2" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobileMenu" class="mobile-menu fixed top-0 right-0 w-72 h-full bg-seg-green-deeper z-50 p-8 lg:hidden">
      <button class="absolute top-5 right-5 text-white/50 hover:text-white" onclick="document.getElementById('mobileMenu').classList.remove('open')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="flex flex-col gap-7 mt-14">
        <a href="chaozan-travel.html" class="text-white/80 font-serif text-base" onclick="document.getElementById('mobileMenu').classList.remove('open')">返回首页</a>
        <a href="chaozan-travel.html#about" class="text-white/80 font-serif text-base" onclick="document.getElementById('mobileMenu').classList.remove('open')">关于我们</a>
        <a href="chaozan-travel.html#services" class="text-white/80 font-serif text-base" onclick="document.getElementById('mobileMenu').classList.remove('open')">核心能力</a>
        <a href="chaozan-travel.html#products" class="text-white/80 font-serif text-base" onclick="document.getElementById('mobileMenu').classList.remove('open')">产品线</a>
        <a href="chaozan-travel.html#contact" class="text-white/80 font-serif text-base" onclick="document.getElementById('mobileMenu').classList.remove('open')">联系我们</a>
      </div>
    </div>
  </nav>

  <!-- HERO (shorter) -->
  <section class="relative min-h-[40vh] lg:min-h-[45vh] flex flex-col justify-center overflow-hidden" style="background:linear-gradient(160deg,#0E2420 0%,#1E3D35 35%,#2D5A4E 65%,#1A2E28 100%);">
    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 pt-28 pb-16">
      <div class="flex items-center gap-3 mb-6 fade-in">
        <span class="w-8 h-px bg-seg-gold"></span>
        <span class="text-seg-gold font-sans text-xs tracking-[0.3em] uppercase">Portfolio</span>
      </div>
      <h1 class="font-display text-white leading-[1.05] mb-4 fade-up" style="font-size:clamp(2.2rem,5vw,4rem);">项目案例</h1>
      <p class="font-serif text-white/50 text-base max-w-lg fade-up" style="transition-delay:0.1s">文旅商业 · 城市综合体 · 主题商业 · 产业园区</p>
      <a href="chaozan-travel.html" class="inline-flex items-center gap-2 mt-6 text-white/50 hover:text-white font-sans text-sm transition-colors fade-up" style="transition-delay:0.2s">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        返回首页
      </a>
    </div>
  </section>

  <!-- CASES WITH TABS -->
  <section class="py-16 lg:py-24 bg-white">
    <div class="max-w-6xl mx-auto px-6">
      <!-- Tabs -->
      <div class="flex flex-wrap gap-2 mb-10 fade-up">
        <button class="tab-btn active px-5 py-2 rounded-sm border border-seg-border font-sans text-xs" data-filter="all">全部</button>
        <button class="tab-btn px-5 py-2 rounded-sm border border-seg-border text-seg-muted font-sans text-xs" data-filter="culture">文旅商业</button>
        <button class="tab-btn px-5 py-2 rounded-sm border border-seg-border text-seg-muted font-sans text-xs" data-filter="complex">城市综合体</button>
        <button class="tab-btn px-5 py-2 rounded-sm border border-seg-border text-seg-muted font-sans text-xs" data-filter="theme">主题商业</button>
        <button class="tab-btn px-5 py-2 rounded-sm border border-seg-border text-seg-muted font-sans text-xs" data-filter="industrial">产业园区</button>
      </div>
      <!-- Grid -->
      <div id="caseGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-seg-green-deeper py-10 px-6">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-5">
      <div class="flex items-center gap-3">
        <img src="/images/siyi-logo-white.webp" alt="SEG" class="h-6 w-auto opacity-70">
        <div>
          <p class="text-white/70 font-serif text-sm">肆意股份 · 超赞文旅 <span class="text-white/30 font-sans text-xs">Chaozan Travel</span></p>
          <p class="text-white/30 font-sans text-[10px] mt-0.5">商业地产全过程服务商</p>
        </div>
      </div>
      <p class="text-white/25 font-sans text-xs">© 2025 肆意股份 Super Energy Group. All rights reserved.</p>
      <div class="flex items-center gap-4">
        <a href="/target-convey.html" class="text-white/40 hover:text-white font-sans text-xs transition-colors">目标传达</a>
        <a href="/yiwai.html" class="text-white/40 hover:text-white font-sans text-xs transition-colors">异外文化</a>
      </div>
      <a href="https://cn.segxm.com" class="text-white/40 hover:text-white font-sans text-xs transition-colors flex items-center gap-1.5">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        返回集团首页
      </a>
    </div>
  </footer>

  <script>
    let cases = [];
    const tagToCategory = { luxury: 'culture', premium: 'complex', brand: 'theme', video: 'industrial' };
    const tagToText = { luxury: '文旅商业', premium: '城市综合体', brand: '主题商业', video: '产业园区' };

    const grid = document.getElementById('caseGrid');

    function renderCases(filter) {
      const filtered = filter === 'all' ? cases : cases.filter(c => c.cat === filter);
      grid.innerHTML = filtered.map((c, i) => `
        <div id="case-${c.id}" class="case-card rounded-sm overflow-hidden bg-white shadow-sm border border-seg-border/50 fade-up" style="transition-delay:${i * 0.05}s">
          <div class="h-44 lg:h-52 flex flex-col justify-end p-5 relative" style="background:${c.grad}">
            <div class="absolute top-4 right-4"><span class="case-tag px-2 py-1 bg-white/15 backdrop-blur-sm rounded-sm text-white/80">${c.tag}</span></div>
            <span class="font-sans text-[10px] text-white/50 tracking-widest mb-1.5">${c.city}${c.area ? ' · '+c.area : ''}</span>
            <h3 class="font-display text-white font-bold text-lg leading-tight">${c.name}</h3>
          </div>
          <div class="p-5 border-t border-seg-border/40">
            <p class="font-serif text-seg-muted text-sm leading-relaxed">${c.desc}</p>
          </div>
        </div>
      `).join('');
      // Re-observe new elements
      setTimeout(() => {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.12 });
        grid.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
      }, 10);
    }

    async function loadCasesFromApi() {
      try {
        const resp = await fetch('/api/cases?business_line=chaozan&sort=-order');
        const data = await resp.json();
        if (!Array.isArray(data)) throw new Error('invalid response');
        cases = data.map((item) => ({
          id: item.slug || item.id,
          cat: tagToCategory[item.tag] || 'culture',
          tag: tagToText[item.tag] || '综合服务',
          city: item.city || '',
          name: item.title || '未命名案例',
          area: '',
          desc: item.description || '',
          grad: item.cover_image
            ? `url('${item.cover_image}') center/cover no-repeat`
            : 'linear-gradient(145deg,#0e1a2e 0%,#1a2e4a 50%,#243d5e 100%)',
        }));
        renderCases('all');
      } catch (e) {
        grid.innerHTML = '<p class="text-seg-muted col-span-full">案例加载失败，请稍后重试。</p>';
      }
    }

    loadCasesFromApi();

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCases(btn.dataset.filter);
      });
    });

    // Scroll animations for initial elements
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-up,.fade-in').forEach(el => observer.observe(el));

    // Navbar
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('nav-scrolled', window.scrollY > 80);
    }, { passive: true });

    // Handle hash on load
    if (location.hash) {
      setTimeout(() => {
        const el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 300);
    }
  </script>
</body>
</html>
