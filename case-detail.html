    tailwind.config = {
      theme: {
        extend: {
          colors: {
            seg: {
              green: '#2D5A4E', 'green-dark': '#1E3D35', 'green-deeper': '#162D27',
              'green-light': '#3D7A6A', 'green-pale': '#EBF2F0',

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Serif SC', serif; color: #1A1A1A; background: #fff; }
    .case-tag { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; }
    .section-eyebrow { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #C9A84C; font-weight: 500; }
    .detail-content { line-height: 1.9; }
    .detail-content p { margin-bottom: 1em; }
    .detail-content img { max-width: 100%; border-radius: 4px; margin: 1.5em 0; }
    .detail-content h2, .detail-content h3 { font-weight: 600; margin: 1.5em 0 0.5em; }
  
  /* === Lightbox === */
  .lb-overlay { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; cursor:zoom-out; backdrop-filter:blur(10px); }
  .lb-overlay.active { opacity:1; pointer-events:auto; }
  .lb-overlay img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.5); transform:scale(.95); transition:transform .25s; }
  .lb-overlay.active img { transform:scale(1); }
  .lb-close { position:absolute; top:16px; right:20px; color:#fff; font-size:36px; cursor:pointer; z-index:10; user-select:none; line-height:1; opacity:.7; transition:opacity .2s; }
  .lb-close:hover { opacity:1; }
  .lb-prev, .lb-next { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:40px; cursor:pointer; user-select:none; opacity:.5; transition:opacity .2s; padding:20px; }
  .lb-prev:hover, .lb-next:hover { opacity:1; }
  .lb-prev { left:0; }
  .lb-next { right:0; }
  .lb-counter { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.6); font-size:13px; font-family:sans-serif; }
  .detail-content img { cursor:zoom-in; transition:transform .2s; }
  .detail-content img:hover { transform:scale(1.01); }
  #coverWrap { cursor:zoom-in; }
</style>

<body>

<!-- Header -->
<header class="fixed top-0 left-0 right-0 z-50" style="background: rgba(14,36,32,0.55); backdrop-filter: blur(8px);">
  <div class="max-w-7xl mx-auto px-6 lg:px-10">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <a href="https://cn.segxm.com" class="flex items-center gap-3 group">
          <img src="/images/siyi-logo-white.webp" alt="SEG" class="h-7 w-auto opacity-90 group-hover:opacity-100 transition-opacity">
          <div class="hidden sm:block">
            <p class="text-white font-serif text-sm font-semibold leading-none tracking-wide">肆意股份</p>
            <p class="text-white/40 text-[9px] tracking-[0.2em] mt-0.5 font-sans">SUPER ENERGY GROUP</p>
          </div>
        </a>
      <nav class="hidden lg:flex items-center gap-8">
        <a href="/" class="text-white/75 hover:text-white text-sm font-sans transition-colors">首页</a>
        <a href="/target-convey.html" class="text-white/75 hover:text-white text-sm font-sans transition-colors">目标传达</a>
        <a href="/portfolio.html" class="text-white/75 hover:text-white text-sm font-sans transition-colors">案例作品集</a>
      </nav>
    </div>
  </div>
</header>

<!-- Content -->
<section class="pt-24 pb-20" id="detailSection">
  <div class="max-w-4xl mx-auto px-6">
    <!-- Back -->
    <a href="/portfolio.html" class="inline-flex items-center gap-2 text-seg-muted hover:text-seg-charcoal font-sans text-sm mb-8 transition-colors">
      ← 返回案例列表
    </a>

    <!-- Loading -->
    <div id="loading" class="text-center py-20">
      <p class="text-seg-muted font-sans">加载中...</p>
    </div>

    <!-- Not Found -->
    <div id="notFound" class="text-center py-20" style="display:none">
      <p class="text-seg-muted font-sans text-lg">案例未找到</p>
      <a href="/portfolio.html" class="inline-block mt-4 text-seg-gold font-sans hover:underline">返回案例列表</a>
    </div>

    <!-- Detail -->
    <div id="detail" style="display:none">
      <!-- Hero Header with intro -->
      <div class="bg-seg-green-deeper rounded-sm overflow-hidden mb-12 p-10 lg:p-14">
        <span class="section-eyebrow">Case Study</span>
        <h1 id="dTitle" class="font-display text-3xl lg:text-4xl font-bold text-white mt-5"></h1>
        <div class="flex items-center gap-4 mt-4">
          <span id="dCity" class="font-sans text-white/50 text-sm"></span>
          <span id="dTag" class="case-tag px-3 py-1 bg-white/10 text-seg-gold rounded-sm"></span>
        </div>
        <p id="dDesc" class="font-serif text-white/70 text-lg leading-relaxed mt-8 border-l-2 border-seg-gold pl-6"></p>
      </div>

      <!-- Cover Image -->
      <div id="coverWrap" class="rounded-sm overflow-hidden mb-10" style="display:none">
        <img id="coverImg" class="w-full" alt="">
      </div>

      <!-- Content Images -->
      <div id="dContent" class="detail-content font-serif text-seg-charcoal"></div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-seg-charcoal py-12">
  <div class="max-w-6xl mx-auto px-6 text-center">
    <p class="font-sans text-white/40 text-xs tracking-wide">&copy; 2024 肆意股份 · Great Decision. All rights reserved.</p>
  </div>
</footer>

<script>
const tagLabels = { lighthouse: '灯塔项目', citybrand: '城市&品牌案例', xiaohongshu: '小红书传播' };

async function loadDetail() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notFound').style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/cases?slug=' + encodeURIComponent(slug));
    const cases = await res.json();

    if (!cases || !cases.length) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
      return;
    }

    const c = cases[0];
    document.title = c.title + ' | 肆意股份';

    if (c.cover_image) {
      document.getElementById('coverImg').src = c.cover_image;
      document.getElementById('coverImg').alt = c.title;
      document.getElementById('coverWrap').style.display = 'block';
    }

    document.getElementById('dTitle').textContent = c.title;
    document.getElementById('dCity').textContent = c.city || '';
    document.getElementById('dTag').textContent = tagLabels[c.tag] || c.tag || '';
    document.getElementById('dDesc').textContent = c.description || '';
    document.getElementById('dContent').innerHTML = c.content || '<p class="text-seg-muted">暂无详情内容</p>';
    // Lightbox: collect all images and make clickable
    window._lbImages = [];
    const coverImg = document.getElementById('coverImg');
    if (coverImg && coverImg.src) { window._lbImages.push({src:coverImg.src, el:coverImg}); coverImg.onclick=function(){openLb(0);}; }
    document.querySelectorAll('#dContent img').forEach(function(img){
      if(img.src){window._lbImages.push({src:img.src,el:img});img.onclick=function(e){e.preventDefault();openLb(window._lbImages.findIndex(function(x){return x.el===img;}));};}
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('detail').style.display = 'block';
  } catch(e) {
    console.error(e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notFound').style.display = 'block';
  }
}


// === Lightbox Functions ===
var _lbIdx=0;
function openLb(i){_lbIdx=i;showLb();}
function showLb(){var o=document.getElementById('lbOverlay'),img=document.getElementById('lbImg'),ctr=document.getElementById('lbCounter');if(!_lbImages.length)return;img.src=_lbImages[_lbIdx].src;o.classList.add('active');ctr.textContent=(_lbIdx+1)+' / '+_lbImages.length;document.body.style.overflow='hidden';}
function closeLb(){document.getElementById('lbOverlay').classList.remove('active');document.body.style.overflow='';}
function navLb(d){_lbIdx=(_lbIdx+d+_lbImages.length)%_lbImages.length;showLb();}
document.addEventListener('keydown',function(e){if(!document.getElementById('lbOverlay').classList.contains('active'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')navLb(-1);if(e.key==='ArrowRight')navLb(1);});

loadDetail();
</script>

</body>
