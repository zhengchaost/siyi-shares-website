<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电子名片 · 肆意股份</title>
<meta property="og:title" content="肆意股份 · 电子名片">
<meta property="og:description" content="SUPER ENERGY GROUP — 用实效·专业，提升城市品牌">
<meta property="og:image" content="https://cn.segxm.com/images/siyi-logo-white.webp">
<link rel="stylesheet" href="/css/tailwind.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
  body { font-family: 'Noto Serif SC', 'Inter', serif; background: #0D1B2A; }
  .card-glow { box-shadow: 0 0 60px rgba(201,169,110,0.15), 0 0 120px rgba(201,169,110,0.05); }
  .action-btn { transition: all 0.3s ease; }
  .action-btn:active { transform: scale(0.96); }
  .gold-line { background: linear-gradient(90deg, transparent, #C9A96E, transparent); }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #C9A96E; color: #0D1B2A; padding: 8px 24px;
    border-radius: 20px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="toast" class="toast"></div>

<div class="w-full max-w-sm">
  <!-- Card -->
  <div class="card-glow bg-gradient-to-br from-[#1a2a3a] to-[#0D1B2A] rounded-2xl overflow-hidden">
    <!-- Header with logo -->
    <div class="px-6 pt-6 pb-4 text-center">
      <div class="inline-flex items-center gap-2 mb-4">
        <img src="/images/siyi-logo-white.webp" alt="SEG" class="h-8 opacity-90" style="filter: invert(1) brightness(0);">
        <span class="text-white/80 text-sm tracking-[0.15em] font-sans">SUPER ENERGY GROUP</span>
      </div>
      <div class="gold-line h-px mb-5"></div>
      <h1 id="card-name" class="text-white text-2xl font-semibold tracking-wide">—</h1>
      <p id="card-title" class="text-[#C9A96E] text-sm mt-1 tracking-wider">—</p>
    </div>

    <!-- Company -->
    <div class="px-6 pb-4">
      <div class="bg-white/5 rounded-xl p-4">
        <p class="text-white/60 text-xs tracking-wider mb-1">肆意股份 · <span id="card-dept">目标传达</span></p>
        <p class="text-white/40 text-[11px] leading-relaxed">用实效·专业，提升城市品牌，重塑不动产价值</p>
      </div>
    </div>

    <!-- Contact Actions -->
    <div class="px-6 pb-6 space-y-2.5">
      <!-- Phone -->
      <a id="phone-btn" href="tel:" class="action-btn flex items-center gap-3 bg-white/[0.07] hover:bg-white/[0.12] rounded-xl px-4 py-3 group">
        <div class="w-9 h-9 rounded-full bg-[#C9A96E]/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-[#C9A96E]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-white/50 text-[10px] tracking-wider">电话</p>
          <p id="card-phone" class="text-white text-sm">—</p>
        </div>
        <svg class="w-4 h-4 text-white/20 group-hover:text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </a>

      <!-- WeChat -->
      <button id="wechat-btn" class="action-btn w-full flex items-center gap-3 bg-white/[0.07] hover:bg-white/[0.12] rounded-xl px-4 py-3 group text-left">
        <div class="w-9 h-9 rounded-full bg-[#07C160]/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-[#07C160]" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.042.448l-.303 1.854a.34.34 0 00.502.36l2.18-1.3a.594.594 0 01.498-.058c.897.26 1.848.406 2.832.406.279 0 .554-.012.827-.034a6.56 6.56 0 01-.263-1.832c0-3.627 3.447-6.57 7.697-6.57.258 0 .513.013.765.036C17.666 4.636 13.558 2.188 8.691 2.188zm7.383 17.284c1.506-.9 2.468-2.27 2.468-3.806 0-2.727-2.904-4.938-6.484-4.938-3.58 0-6.484 2.21-6.484 4.938 0 2.727 2.904 4.938 6.484 4.938.65 0 1.278-.078 1.87-.22a.466.466 0 01.392.047l1.397.834a.27.27 0 00.398-.285l-.193-1.17a.466.466 0 01.352-.518z"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-white/50 text-[10px] tracking-wider">微信号</p>
          <p id="card-wechat" class="text-white text-sm">—</p>
        </div>
        <span class="text-[#07C160] text-[10px] tracking-wider border border-[#07C160]/30 rounded-full px-2 py-0.5 group-hover:bg-[#07C160]/10">复制</span>
      </button>

      <!-- Email -->
      <a id="email-btn" href="mailto:" class="action-btn flex items-center gap-3 bg-white/[0.07] hover:bg-white/[0.12] rounded-xl px-4 py-3 group">
        <div class="w-9 h-9 rounded-full bg-blue-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-white/50 text-[10px] tracking-wider">邮箱</p>
          <p id="card-email" class="text-white text-sm">—</p>
        </div>
        <svg class="w-4 h-4 text-white/20 group-hover:text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>

  <!-- Save Contact Button -->
  <a id="vcard-btn" href="#" class="action-btn block mt-4 w-full text-center bg-[#C9A96E] hover:bg-[#b8985d] text-[#0D1B2A] font-semibold text-sm py-3 rounded-xl tracking-wider">
    保存到通讯录
  </a>

  <!-- Edit hint -->
  <p class="text-white/20 text-[10px] text-center mt-4 leading-relaxed">
    编辑名片：在URL添加参数<br>
    <code class="text-white/30">?name=姓名&title=职位&phone=电话&wechat=微信&email=邮箱&dept=部门</code>
  </p>
</div>

<script>
const defaults = {
  name: '曾铮',
  title: '品牌策划总监',
  phone: '13606009988',
  wechat: 'zhengchaost',
  email: 'zheng@lngshi.com',
  dept: '目标传达'
};

const params = new URLSearchParams(window.location.search);
const data = {};
for (const key in defaults) {
  data[key] = params.get(key) || defaults[key];
}

document.getElementById('card-name').textContent = data.name;
document.getElementById('card-title').textContent = data.title;
document.getElementById('card-phone').textContent = data.phone;
document.getElementById('card-wechat').textContent = data.wechat;
document.getElementById('card-email').textContent = data.email;
document.getElementById('card-dept').textContent = data.dept;
document.getElementById('phone-btn').href = 'tel:' + data.phone;
document.getElementById('email-btn').href = 'mailto:' + data.email;

// Copy WeChat
document.getElementById('wechat-btn').addEventListener('click', function() {
  navigator.clipboard.writeText(data.wechat).then(function() {
    showToast('微信号已复制，去微信添加吧');
  }).catch(function() {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = data.wechat;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('微信号已复制');
  });
});

// vCard
const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${data.name}
ORG:肆意股份\\n${data.dept}
TITLE:${data.title}
TEL;TYPE=CELL:${data.phone}
EMAIL:${data.email}
END:VCARD`;

const blob = new Blob([vcard], { type: 'text/vcard' });
const vcardUrl = URL.createObjectURL(blob);
document.getElementById('vcard-btn').href = vcardUrl;
document.getElementById('vcard-btn').download = data.name + '.vcf';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// Update page title
document.title = data.name + ' · 肆意股份';
</script>
</body>
</html>
